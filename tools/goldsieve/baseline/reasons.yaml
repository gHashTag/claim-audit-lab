# Классификация отклонений от baseline.
#
# Каждое расхождение свежего прогона с baseline обязано иметь запись здесь.
# Без записи гейт закрывается: неклассифицированное отклонение — это будущее
# «молчаливое исключение», то есть потерянный дефект.
#
# reason_code:
#   corpus-fixed          — вердикт изменился, потому что исправлен КОРПУС
#                           (подтверждается сменой отпечатка входных файлов
#                           или связанным исправлением в репозитории)
#   corpus-data-changed   — изменились входные данные без правки утверждения
#   sieve-strengthened    — вердикт изменился из-за усиления самого сита
#   sieve-defect          — вердикт изменился из-за ДЕФЕКТА сита (требует ремонта)
#   wrapper-identity-change — изменение сработало из-за смены формы обёртки
#                           наблюдения, а не из-за содержания утверждения
#   claim-restated        — переформулировано само утверждение
deviations:
  - case: cases/established_constants_fit_count.py
    claim: раздел Established Constants содержит 75 совпадений
    from: ОПРОВЕРГНУТО
    to: ПУСТО
    reason_code: corpus-fixed
    evidence: >-
      Исправление принято в корпусе по PR gHashTag/trinity#738: число совпадений
      в разделе приведено к пересчитанному значению, поэтому расхождение
      исчезло, а проверка стала вырожденной (сравнивать нечего).
    url: https://github.com/gHashTag/trinity/pull/738
  - case: cases/sacred_formula_full_external_20260814.py
    claim: Формула 6π⁵ воспроизводит отношение масс протона и электрона
    from: ВОПРОС
    to: ОПРОВЕРГНУТО
    reason_code: corpus-data-changed
    evidence: >-
      Отпечаток входных файлов изменился 1f4d53ef6425f029 -> c2e01b8c25c8a0b3.
      Промах по внешней цели CODATA сохраняется (-1,08e6 сигма при пороге
      5,06 сигма); переход ВОПРОС -> ОПРОВЕРГНУТО вызван изменением входа, а
      не правкой каскада.
  - case: cases/sacred_formula_full_external_20260814.py
    claim: Формула 17π²φ⁵/9 воспроизводит отношение масс мюона и электрона
    from: ВОПРОС
    to: ОПРОВЕРГНУТО
    reason_code: corpus-data-changed
    evidence: >-
      Тот же сдвиг отпечатка входов 1f4d53ef6425f029 -> c2e01b8c25c8a0b3.
      Промах -4095 сигма против CODATA/NIST 206,7682827 +- 4,6e-6 сохраняется.
  - case: cases/sidak_threshold_20260815.py
    claim: При 123 201 испытании и семейной ошибке 0,05 порог Шидака равен 5,06σ
    from: ПОДТВЕРЖДЕНО
    to: ДОПУЩЕНИЕ НЕ ПРОВЕРЕНО
    reason_code: precondition-declared-unverified
    evidence: >-
      Тик 48 ввёл семантическую предпосылку tests_independent в паспорт цели
      (goldsieve/preconditions.py). Формула Šidák выведена из НЕЗАВИСИМОСТИ
      испытаний, а члены семейства формул корпуса зависимы по построению
      (общие множители), поэтому предпосылка объявлена unknown и вердикт
      понижен с ПОДТВЕРЖДЕНО до ДОПУЩЕНИЕ НЕ ПРОВЕРЕНО (статус охвата
      assumption-unverified, подтип independence_unknown). Само тождество не
      опровергнуто: три независимых пути (inv_cdf по double, 50 знаков mpmath
      через erfinv, двоичный поиск по erf) согласуются в пределах 1e-9, и
      напечатанное 5,06 сигма согласуется с вычисленным 5,0613316768 сигма.
      Изменение вердикта вызвано УСИЛЕНИЕМ методологического контракта, а не
      изменением корпуса и не ошибкой прежнего расчёта. Отпечаток рецепта
      сместился aacbcf2922ff3865 -> bd7159ae56060155 из-за перехода эталона на
      устойчивую запись -expm1(log1p(-alpha)/m) и замены второго пути с
      двоичного поиска по той же арифметике на mpmath 50 знаков.
