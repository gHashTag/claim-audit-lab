# Coverage manifest детектора косвенной тавтологии (пункт 3 приказа тика 41).
#
# ЭТО ОБЪЯВЛЕНИЕ, А НЕ ДОКАЗАТЕЛЬСТВО. Каждая строка сверяется кодом
# (coverage_manifest.py) с фактическим составом корпуса фикстур и каталога
# мутаций: расхождение объявления с фактом закрывает гейт. Иначе манифест
# превратился бы ровно в то, чем был отчёт тика 39 — заявление о покрытии,
# которого нет.
#
# Поля по каждому конструкту:
#   supported        — разбирается ли конструкция (true/false)
#   positive         — сколько положительных фикстур ОБЯЗАНО быть в корпусе
#   negative         — сколько негативных фикстур ОБЯЗАНО быть
#   mutation_targets — имена мутаций, целящихся в код именно этого разбора
#   fallback         — что делает детектор, когда разбор не удаётся
#   limits           — известные ограничения внутри поддержанного класса

runtimes:
  # Версии, на которых прогон фактически состоялся. Формулировка «проверено на
  # указанных версиях CPython», а НЕ «платформонезависимо»: другая ОС в матрице
  # отсутствует (пункт 5 приказа), статус — not-evaluated.
  verified:
    - CPython 3.14.3
    - CPython 3.14.4
  partial:
    - id: CPython 3.12.13
      reason: >-
        нет numpy и pyyaml: каскад сит и калибровка на реестре физически
        непрогоняемы; разбор конструкций (корпус фикстур и мутации) от этих
        пакетов не зависит и прогоняется полностью
  platforms:
    verified:
      - Linux (песочница)
    not_evaluated:
      - id: macOS
        reason: >-
          локальное устройство не ответило в трёх попытках тика 41 (120 с,
          120 с, 630 с); брутфорс запрещён, поэтому статус not-evaluated,
          а не «работает»; задача выведена в pending/os-matrix.yaml
          с владельцем и бюджетом повторов
        pending: pending/os-matrix.yaml
      - id: Windows
        reason: устройство недоступно

constructs:
  прямые формы:
    supported: true
    positive: 3
    negative: 8
    mutation_targets:
      - разбор прямых вызовов (calls и имя-функция)
    fallback: нет
    limits: []

  globals:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - извлечение глобального состояния (_tainted_globals)
      - наполнители глобального состояния (_tainted_writers)
    fallback: при неразрешимом имени возвращается False (подозрение снимается)
    limits:
      - запись в глобальное состояние из другого модуля не отслеживается

  # Новый класс тика 42 (пункт 2 приказа). Ведётся ОТДЕЛЬНО от globals:
  # там состояние только наполняется, а здесь изменяется — порядок записи
  # относительно наблюдения, тени, alias в контейнере и `global` — свои формы.
  mutable globals:
    supported: true
    positive: 7
    negative: 5
    mutation_targets:
      - запись в глобальный контейнер (оба пути)
      - загрязнение из тела функции (обход всего дерева)
    fallback: при неразрешимом имени возвращается False (подозрение снимается)
    limits:
      - >-
        временной порядок не различается: загрязнение считается по ВСЕМУ
        телу модуля, поэтому запись ПОСЛЕ объявления наблюдения даёт тот же
        вердикт, что и ДО (консервативно в сторону подозрения)
      - >-
        запись в состояние из ДРУГОГО модуля по-прежнему не отслеживается:
        межмодульный граф (modgraph) разрешает только передачу вызова,
        а не запись в глобальное состояние чужого модуля
      - >-
        ветка `ast.Subscript` в `_tainted_globals` избыточна (измерено
        трассировкой в тике 42): обход цели всё равно даёт корневое `ast.Name`,
        поэтому одноточечная мутация этой ветки НЕ различается и заменена
        мутацией, убирающей оба пути

  closure:
    supported: true
    positive: 8
    negative: 3
    mutation_targets:
      - чтение захваченного значения (_closure_value)
      - вложенные определения (_local_defs)
    fallback: при недоступной ячейке возвращается False
    limits:
      - ячейка, заполняемая после первого вызова, читается как пустая

  descriptor:
    supported: true
    positive: 6
    negative: 5
    mutation_targets:
      - разбор дескриптора (_descriptor_origin)
      - игнор параметров протокола (PROTOCOL_PARAMS)
      - база разобранного атрибута (resolved_bases)
    fallback: >-
      при неизвестном виде дескриптора возвращается None, и разбор идёт по
      прежнему пути (чтение поля объекта)
    limits:
      - >-
        имя читаемого поля, собранное в __set_name__ и известное только в
        рантайме, не связывается с полем, заполненным в __init__ (фикстура в
        LIMITATIONS)

  bound method:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - приёмник связанного объекта (self/cls)
      - разбор поля объекта (_field_from_ref)
    fallback: нет
    limits: []

  callable object:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - разбор вызываемого объекта (__call__)
    fallback: нет
    limits: []

  decorator:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - разбор обёртки декоратора (__wrapped__)
    fallback: нет
    limits:
      - декоратор, подменяющий источник данных без __wrapped__, не прослеживается

  default arg:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - значение по умолчанию от эталона
    fallback: нет
    limits: []

  lambda:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - разбор lambda (_node_for)
    fallback: при недоступном исходном тексте возвращается False
    limits: []

  partial:
    supported: true
    positive: 3
    negative: 1
    mutation_targets:
      - нормализация functools.partial
    fallback: нет
    limits: []

  # --- конструкции, охват по которым НЕ заявлен -----------------------------
  # Приказ тика 41: глубина вместо ширины. Эти классы не берутся, пока closures
  # и descriptors не доведены до позитивных, негативных и мутационных
  # доказательств. Перечислены явно, чтобы «не заявлено» нельзя было прочитать
  # как «работает».
  exec/eval:
    supported: false
    positive: 0
    negative: 0
    mutation_targets: []
    fallback: исходный текст недоступен, возвращается False
    limits: [охват не заявлен; фикстур нет]

  генераторы:
    supported: false
    positive: 0
    negative: 0
    mutation_targets: []
    fallback: разбор тела идёт как у обычной функции, yield не отслеживается
    limits: [охват не заявлен; фикстур нет]

  корутины:
    supported: false
    positive: 0
    negative: 0
    mutation_targets: []
    fallback: await не отслеживается
    limits: [охват не заявлен; фикстур нет]

  метаклассы:
    supported: false
    positive: 0
    negative: 0
    mutation_targets: []
    fallback: атрибут, созданный метаклассом, читается как обычный
    limits: [охват не заявлен; фикстур нет]

  contextvars:
    supported: false
    positive: 0
    negative: 0
    mutation_targets: []
    fallback: значение из контекста не отслеживается
    limits: [охват не заявлен; фикстур нет]

  C-расширения:
    supported: false
    positive: 0
    negative: 0
    mutation_targets: []
    fallback: исходный текст недоступен, возвращается False
    limits: [охват не заявлен; исходного текста нет в принципе]

# --- анализаторы (тик 42) ---------------------------------------------------
# Отдельно от конструктов: это не классы конструкций, а МОДУЛИ разбора. Для
# каждого объявлено, чем доказано, что он вообще работал, и какие причины отказа
# он умеет называть. Список причин сверяется кодом с закрытым списком в модуле.
analyzers:
  proof:
    role: машинный след анализатора (files_parsed, functions_seen, nodes_visited,
      edges_resolved, chains_expanded, причины unsupported)
    selftest_checks: 17
    execution_proof: >-
      реальный маршрут CLI (`python3 -m goldsieve run cases/…`) в подпроцессе с
      GOLDSIEVE_PROOF; пустой или тривиальный след — авария CI (execution_proof.py)
    affects_verdict: false
  modgraph:
    role: межмодульный граф импортов; только статически разрешимые рёбра
    selftest_checks: 17
    execution_proof: >-
      самопроверка модуля включает подставку «граф не исполняет код»
      (файл с `raise SystemExit` разбирается, но не запускается)
    affects_verdict: false
    unsupported_reasons_from: goldsieve.proof.REASONS

# --- границы применимости (считаются КОДОМ, не пишутся руками) --------------
# Наблюдаемая специфичность 1,0000 не означает нулевой доли ложных: при N
# честных отрицательных примерах и нуле срабатываний грубая 95 %-верхняя граница
# доли по правилу трёх равна 3/N. Прежняя формулировка «около 5 % на 60
# наблюдениях» отозвана: считать нужно по числу НЕГАТИВНЫХ фикстур.
bounds:
  negative_fixtures: 28
  false_positives: 0
  observed_specificity: 1.0
  rule_of_three_upper: 0.1071
  note: >-
    доля ложных срабатываний НЕ измерена как нулевая; измерено лишь отсутствие
    срабатываний на 28 честных отрицательных примерах, что даёт верхнюю оценку
    около 11 % (3/28). Формулировки «детектор полностью верен» и «нулевая
    вероятность ложного срабатывания» запрещены.

# --- оболочка тика и её обвязка (тик 43) ------------------------------------
# Молчание проверки — не покрытие. Каждая проверка ниже обязана: (1) быть в
# составе отпечатка baseline, (2) стоять отдельным шагом гейта, (3) давать
# объявленное число утверждений. Первые два условия ловят самый частый отказ:
# проверка написана, но в гейт не включена — и её падение никого не блокирует.
shell_checks:
  goldsieve/runlog.py:
    gate_step: журнал вызовов (run_id)
    selftest_cmd: [-m, goldsieve.runlog]
    selftest_checks: 19
    role: единый run_id, статусы, замок, чтение неполного журнала
  snapshot_manifest.py:
    gate_step: проверяемый снимок
    selftest_cmd: [snapshot_manifest.py, selftest]
    selftest_checks: 8
    role: SHA-256 входов, отчётов и журналов; перепроверка без сети
  archive_contract.py:
    gate_step: контракт архива скила
    selftest_cmd: [archive_contract.py, selftest]
    selftest_checks: 9
    role: предел записей, порядок, дубликаты, детерминированный zip
  bench.py:
    gate_step: статистика измерителя
    selftest_cmd: [bench.py, --selftest]
    selftest_checks: 8
    role: median/p95/min/max, cold/warm, объявленные причины малого числа повторов
  tri_integration_test.py:
    gate_step: интеграционные тесты оболочки
    selftest_cmd: null
    selftest_checks: 14
    skip_run_reason: >-
      сам файл И ЕСТЬ прогон (запускает tri подпроцессом, спит и убивает
      процессы, около двенадцати секунд); повторный запуск внутри манифеста
      удвоил бы время гейта без нового знания. Число утверждений проверяется
      шагом гейта.
    role: фон, одновременный watch, crash, обрыв журнала, lock collision, abort
