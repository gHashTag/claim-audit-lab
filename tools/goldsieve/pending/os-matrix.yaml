# Ожидающая задача: матрица операционных систем.
#
# Причина существования файла: в тиках 41 и 42 локальное устройство не
# отвечало, и три попытки подряд сожгли бюджет тика без результата. Брутфорс
# запрещён, поэтому задача выведена из тела тика в явную очередь с владельцем
# и бюджетом повторов. Пока задача открыта, статус macOS в манифесте остаётся
# not-evaluated — «не проверено», а не «работает».

task: проверить каскад и детектор на macOS
id: os-matrix-macos
status: pending   # закрытый словарь статусов: runlog.STATUSES
scope_status: platform-unverified
owner: Dmitrii Vasilev (gHashTag) — только у него есть доступ к устройству
blocked_by: |
  pc bash подтвердил CPython 3.14.3, но расширенный отпечаток platform/machine
  в тике 29 не завершился; полный каскад на рабочей копии не запускался.
retry_budget:
  attempts_per_tick: 1
  timeout_seconds: 120
  total_attempts_left: 0
  rule: |
    Одна попытка на тик, не более. Исчерпание бюджета не даёт права
    объявлять платформу проверенной: задача переходит в status: abandoned
    с причиной, а статус в манифесте остаётся not-evaluated.
acceptance:
  - python3 -m goldsieve.selftest на macOS: тот же счёт, что в песочнице
  - measure_identity.py: те же 45/45 и 28/28
  - mutation_identity.py: те же 17/17
  - вывод дословно приложен к ведомости; пересказ не принимается
notes:
  - >-
    формулировка результата — «проверено на указанных версиях CPython на
    macOS», не «платформонезависимо»
