# Протокол конечновысотной поправки Bogomolny-Bohigas-Leboeuf-Monastra (BBLM).
# Пункт 2 приказа 2026-08-18: вместо текстового «OPEN» — машинный список
# недостающих элементов. Заполнено ТОЛЬКО то, что подтверждено кодом или
# первоисточником; всё остальное отсутствует НАМЕРЕННО и попадает в ВОПРОС.
#
# Правило заполнения: элемент считается присутствующим лишь тогда, когда его
# можно ПРОВЕРИТЬ машиной. Ссылка без формулы, формула без параметров высоты и
# «мы примерно понимаем» элементами не являются.

formula:
  present: true
  # Ведущая конечновысотная поправка: эффективное число «уровней» и связанный
  # масштабный множитель, оба линейны по L = log(T/2pi).
  expression_n_eff: "0.230158 * L"
  expression_alpha_minus_1: "1.4720 / L"
  variable: "L = log(T / (2*pi)), T — высота на критической прямой"
  source_url: "https://arxiv.org/abs/nlin/0601006"
  source_note: >-
    Bogomolny, Bohigas, Leboeuf, Monastra (2006). Численные коэффициенты взяты
    из корпуса Trinity и НЕ пересчитаны из статьи независимым путём: это
    зафиксировано отдельным недостающим элементом coefficient_rederivation.

coefficient_rederivation:
  present: false
  needed: >-
    Независимый вывод коэффициентов 0.230158 и 1.4720 из формул статьи, а не
    перенос чисел из корпуса. Без этого сравнение опирается на цитату.

height_parameters:
  present: true
  t_min: 14.134725
  t_max: 74920.827
  n_zeros: 100000
  set: "corpus/trinity/data/zeta/zeros_odlyzko_100k.txt"
  L_at_t_max: 9.3863
  L_at_t_mid: 8.6934
  L_at_mean_T: 8.9339
  verifier: "bblm_height.py"
  attribution: >-
    Корпусное L ~ 9.4 машинно отнесено к L НА ВЕРХНЕЙ ГРАНИЦЕ набора Одлыжко
    (9.3863), а не к типичной высоте выборки (середина диапазона даёт 8.6934).
    Следствие: ведущая поправка alpha-1 = 1.4720/L при L = 9.3863 равна 0.15683,
    а при L середины диапазона 0.16932 — расхождение около 8 % происходит
    ТОЛЬКО из выбора точки, в которой берётся L.

per_bin_heights:
  present: false
  needed: >-
    L, посчитанное для КАЖДОЙ корзины корпусного бинного анализа
    (zeta_bin_analysis_update.md), а не одно число на весь набор: поправка
    зависит от L, поэтому сравнение по корзинам требует L корзины.

unfolding_mode:
  present: true
  mode: "theta"
  detail: >-
    Развёртка по функции Римана-Зигеля theta: расстояния нормируются локальной
    плотностью, паспорт рецепта зафиксирован в zeta_passport.py и
    воспроизводит корпусное std 0.4009 (0.4009327315 полной theta,
    0.4009263778 ведущим членом).
  verifier: "zeta_passport.py"

error_estimate_method:
  present: false
  needed: >-
    Способ оценки погрешности предсказанной поправки: бутстрэп по нулям либо
    аналитическая дисперсия статистики. Без него отклонение нельзя выразить в
    сигмах, а значит сито С15 не имеет знаменателя.

out_of_sample_check:
  present: false
  needed: >-
    Проверка вне выборки: коэффициенты фиксируются на одном диапазоне высот,
    предсказание проверяется на ДРУГОМ (более высоком) диапазоне. Без этого
    согласие внутри одного набора нулей не отличимо от подгонки.

shape_vs_scale_discrimination:
  present: false
  needed: >-
    Машинная проверка того, что поправка меняет ФОРМУ распределения, а не
    только масштаб. Корпусные наблюдения (std -5.50 %, p95 -2.17 %, p50 +0.29 %)
    чистым масштабированием s -> alpha*s не объясняются, поэтому протокол
    обязан предъявить разложение на масштабную и формообразующую части.
